title: 100 Papers That Changed AI
description: Landmark ML papers reimplemented from scratch in PyTorch, with plain-English explainers and notebooks validated on Kaggle.
url: https://nadeemcite.github.io
baseurl: /research-papers
author: nadeemcite
lang: en

# Just the Docs (https://just-the-docs.com), loaded via GitHub Pages' remote theme support
remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: dark  # matches the dark banner and family-tree SVGs

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "GitHub":
    - "https://github.com/nadeemcite/research-papers"
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "View this page on GitHub"
gh_edit_repository: "https://github.com/nadeemcite/research-papers"
gh_edit_branch: "main"
gh_edit_view_mode: "blob"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: false

titles_from_headings:
  enabled: true
  strip_title: false

exclude:
  - scripts/
  - "**/.notebook_spec.json"
  - .gitignore

